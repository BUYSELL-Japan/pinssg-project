[build]
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/zh-tw/*"
  to = "/zh/:splat"
  status = 301
  force = false

[[redirects]]
  from = "/zh-tw"
  to = "/zh"
  status = 301
  force = false

[[redirects]]
  from = "/en/zh/*"
  to = "/zh/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/en/*"
  to = "/en/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/en/*"
  to = "/en/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh/zh/*"
  to = "/zh/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/zh-tw/en/*"
  to = "/en/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/en/zh-tw/*"
  to = "/zh/:splat"
  status = 301
  force = true

[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/_astro/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=utf-8"

[[headers]]
  for = "/*.css"
  [headers.values]
    Content-Type = "text/css; charset=utf-8"

